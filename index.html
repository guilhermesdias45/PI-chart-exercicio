<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<style>
    body{
        display: flex;
        align-items: center;
        height: 94vh;
        justify-content: center;
        margin: auto;
    }
    canvas{
        position: relative;
    }
    div{
        width: 500px;
        height: 400px;
    }
</style>
<body>
    <div>
        <canvas id="canvas_line"></canvas>
    </div>
    <div>
        <canvas id="canvas_bar"></canvas>
    </div>
</body>
</html>
<script>
    const horas = ["12:00", "13:00", "14:00", "15:00", "16:00", "17:00"];

    const data_line = {
        labels: horas,
        datasets: [{
          label: 'Temperatura (ºC)',
          data: [30, 29, 28, 25, 22, 23],
          backgroundColor: 'blue',
          borderColor: 'blue',
          borderWidth: 3
        }, {
            label: 'Umidade (%)',
          data: [82, 80, 82, 85, 80, 83],
          backgroundColor: 'red',
          borderColor: 'red',
          borderWidth: 3
        }]}

    const config_line = {
      type: 'line',
      data: data_line,
      options: {}
    };

    const mes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho"];

    const data_bar = {
        labels: mes,
        datasets: [{
        label: 'Temperatura Média (ºC)',
          data: [22, 24, 27, 23, 20, 18],
          backgroundColor: 'blue',
          borderColor: 'blue',
          borderWidth: 3
        }, {
            label: 'Umidade Média (%)',
          data: [90, 89, 93, 87, 88, 82],
          backgroundColor: 'red',
          borderColor: 'red',
          borderWidth: 3
        }]}


    const config_bar = {
      type: 'bar',
      data: data_bar,
      options: {}
    };
    

    const chart_line = new Chart(
        document.getElementById('canvas_line'),
        config_line
    );

    const chart_bar = new Chart(
        document.getElementById('canvas_bar'),
        config_bar
    )

  </script>
